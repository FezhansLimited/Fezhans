<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | The GOAT Digital Agency</title>
  <meta name="description" content="Something extraordinary is coming on 19 November 2026. The GOAT Digital Agency official launch countdown.">
  <link rel="icon" type="image/png" href="images/goat-head-logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between items-center relative overflow-hidden selection:bg-blue-600 selection:text-white">

  <!-- AMBIENT GLOW BACKGROUND ORBS -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-600/20 rounded-full blur-[140px] pointer-events-none"></div>
  <div class="absolute bottom-10 right-10 w-96 h-96 bg-cyan-500/15 rounded-full blur-[120px] pointer-events-none"></div>

  <!-- NAVIGATION HEADER -->
  <header class="w-full relative z-20 py-6 px-4 sm:px-8 border-b border-slate-800 bg-slate-950">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex flex-row items-center gap-3 group">
        <img src="images/goat-head-logo.png" alt="The GOAT Logo" class="w-10 h-10 object-contain">
        <div class="flex flex-col items-start justify-center relative pt-1.5">
          <div class="relative flex items-baseline">
            <span class="absolute -top-2.5 -left-1 text-[8px] font-black uppercase text-blue-400 transform -rotate-12 tracking-wider leading-none select-none">THE</span>
            <span class="text-xl font-black text-white tracking-tight leading-none">GOAT</span>
          </div>
          <span class="text-[8px] font-extrabold tracking-widest uppercase text-blue-400 mt-0.5">Digital Agency</span>
        </div>
      </a>
      <a href="index.html" class="px-5 py-2.5 rounded-lg border border-slate-700 text-slate-200 hover:text-white hover:border-blue-500 text-xs font-black uppercase tracking-wider transition bg-slate-900">
        ENTER MAIN SITE →
      </a>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="relative z-10 max-w-4xl mx-auto px-4 py-12 text-center flex flex-col items-center justify-center space-y-8 my-auto">
    
    <!-- TOP MASSIVE LOGO & BRAND TITLE -->
    <div class="space-y-4">
      <img src="images/goat-head-logo.png" alt="The GOAT Digital Agency Massive Logo" class="w-48 sm:w-64 h-auto mx-auto drop-shadow-[0_0_40px_rgba(26,115,232,0.85)] transform hover:scale-105 transition duration-500">
      
      <span class="inline-block px-4 py-1.5 rounded-md bg-blue-500/15 border border-blue-500/30 text-blue-400 text-xs font-bold uppercase tracking-widest">
        Official Launch Countdown
      </span>
      
      <h1 class="text-4xl sm:text-6xl lg:text-7xl font-black text-white tracking-tight leading-tight">
        The GOAT Digital Agency <br class="sm:hidden" />
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-sky-300 to-cyan-200">DIGITAL AGENCY</span>
      </h1>
    </div>

    <!-- CENTER GOAT IMAGE DISPLAY WITH ELECTRIC BLUE AURA -->
    <div class="relative group my-4">
      <div class="absolute -inset-2 bg-gradient-to-r from-blue-600 via-sky-400 to-cyan-500 rounded-3xl blur-xl opacity-70 group-hover:opacity-100 transition duration-700"></div>
      <div class="relative rounded-3xl overflow-hidden border-2 border-blue-500/40 bg-slate-900/90 shadow-2xl p-4 sm:p-6 max-w-sm sm:max-w-md mx-auto">
        <img src="images/goat-hero.png" alt="The GOAT Digital Agency Electric Blue Goat" class="w-full h-auto object-contain max-h-[320px] rounded-2xl">
      </div>
    </div>

    <!-- UNDER THE GOAT: BLUE COUNTDOWN TIMER TO 19 NOVEMBER 2026 -->
    <div class="w-full max-w-2xl space-y-4 pt-4">
      <p class="text-slate-400 text-xs sm:text-sm font-semibold uppercase tracking-widest">Target Launch Date: November 19, 2026</p>
      
      <div class="grid grid-cols-4 gap-3 sm:gap-6 text-center">
        <!-- DAYS -->
        <div class="bg-slate-900/90 border border-blue-500/40 rounded-2xl p-3 sm:p-5 shadow-[0_0_25px_rgba(26,115,232,0.25)]">
          <span id="days" class="block text-3xl sm:text-5xl font-black text-[#1a73e8] tracking-tight">00</span>
          <span class="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-widest mt-1 block">Days</span>
        </div>
        <!-- HOURS -->
        <div class="bg-slate-900/90 border border-blue-500/40 rounded-2xl p-3 sm:p-5 shadow-[0_0_25px_rgba(26,115,232,0.25)]">
          <span id="hours" class="block text-3xl sm:text-5xl font-black text-[#1a73e8] tracking-tight">00</span>
          <span class="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-widest mt-1 block">Hours</span>
        </div>
        <!-- MINUTES -->
        <div class="bg-slate-900/90 border border-blue-500/40 rounded-2xl p-3 sm:p-5 shadow-[0_0_25px_rgba(26,115,232,0.25)]">
          <span id="minutes" class="block text-3xl sm:text-5xl font-black text-[#1a73e8] tracking-tight">00</span>
          <span class="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-widest mt-1 block">Minutes</span>
        </div>
        <!-- SECONDS -->
        <div class="bg-slate-900/90 border border-blue-500/40 rounded-2xl p-3 sm:p-5 shadow-[0_0_25px_rgba(26,115,232,0.25)]">
          <span id="seconds" class="block text-3xl sm:text-5xl font-black text-cyan-400 tracking-tight">00</span>
          <span class="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-widest mt-1 block">Seconds</span>
        </div>
      </div>
    </div>

    <!-- EARLY ACCESS EMAIL FORM -->
    <div class="w-full max-w-md pt-4">
      <form onsubmit="event.preventDefault(); alert('Thank you! You will be notified on November 19, 2026.');" class="flex flex-col sm:flex-row gap-3">
        <input type="email" required placeholder="Enter your work email" class="flex-1 px-4 py-3.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
        <button type="submit" class="px-6 py-3.5 rounded-lg bg-[#1a73e8] hover:bg-[#1557b0] text-white font-bold text-sm shadow-lg shadow-blue-500/30 transition transform hover:scale-[1.02]">
          Notify Me
        </button>
      </form>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="w-full relative z-20 py-6 px-4 text-center border-t border-slate-900 text-xs text-slate-500">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <p>© 2026 The GOAT Digital Agency Ltd. All rights reserved.</p>
      <div class="flex gap-4">
        <a href="index.html" class="hover:text-white transition">Home</a>
        <a href="websites.html" class="hover:text-white transition">Websites</a>
        <a href="mobile-apps.html" class="hover:text-white transition">Mobile Apps</a>
        <a href="mobile-games.html" class="hover:text-white transition">Mobile Games</a>
        <a href="accessories.html" class="hover:text-white transition">Accessories</a>
      </div>
    </div>
  </footer>

  <!-- COUNTDOWN SCRIPT -->
  <script>
    const launchTargetDate = new Date("November 19, 2026 00:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const timeDifference = launchTargetDate - now;

      if (timeDifference > 0) {
        const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = String(days).padStart(2, '0');
        document.getElementById("hours").innerText = String(hours).padStart(2, '0');
        document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
        document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
      } else {
        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";
      }
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
